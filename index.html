<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Double-tap zoom is stopped with CSS touch-action (src/app/global.css), never user-scalable=no: blocking pinch-zoom
         fails low-vision users. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
    <meta name="description" content="Chevron — a keyboard-driven browser start page with search, macros, AI, and weather.">
    <meta name="theme-color" content="#26364a">
    <meta property="og:title" content="Chevron">
    <meta property="og:description" content="Your browser's blank tab is wasted space. Chevron turns it into a command center.">
    <meta property="og:image" content="https://i.imgur.com/Wa7HcuW.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <!-- crossorigin: fonts are fetched in CORS mode; a preload without it is not reused and the font downloads twice. -->
    <link rel="preload" href="fonts/Onest/Onest.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/Graduate/Graduate.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="font.css">
    <title>Chevron</title>

    <!-- First-paint shell (docs/code/src/app/bootShell.js.md): the idle chevron and a hidden field that keeps keys typed before React
         mounts. The defaults below are the default theme's; the script swaps in the saved theme and chevron settings. -->
    <style>
      html { background-color: #cbbd94; --boot-chevron: #a8402c; --boot-thread: #efe6cc; --boot-accent: #71500d;
        background-image: repeating-linear-gradient(0deg, rgb(255 255 255 / 0.05) 0 1px, transparent 1px 3px),
          repeating-linear-gradient(90deg, rgb(0 0 0 / 0.1) 0 1px, transparent 1px 3px) }
      @media (prefers-color-scheme: dark) { html { background-color: #26364a; --boot-chevron: #d9a02b; --boot-thread: #e9dfc4; --boot-accent: #d9a02b } }
      #boot-shell { position: fixed; inset: 0; z-index: 5; pointer-events: none; --chev: 50vh }
      @supports (height: 1dvh) { #boot-shell { --chev: 50dvh } }
      @media (orientation: portrait) { #boot-shell { --chev: 40vw } }
      #boot-shell svg { position: absolute; top: calc(50% - var(--chev)); left: calc(50% - var(--chev)); width: calc(var(--chev) * 2);
        height: calc(var(--chev) * 2); overflow: visible }
      #boot-shell::after { content: ''; position: absolute; inset: 10px; border-radius: 10px;
        border: 2px dashed color-mix(in srgb, var(--boot-accent) 65%, transparent) }
      /* The four strokes of src/features/chevron/drawChevron.js, in the same proportions. */
      #boot-shell path { --t: var(--boot-thickness, 32px); fill: none; stroke: var(--boot-chevron); stroke-width: var(--t);
        stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; transform: scale(var(--boot-size, 0.2)) }
      #boot-shell path:nth-child(1) { stroke: rgb(0 0 0 / 0.3); stroke-width: calc(var(--t) * 1.2) }
      #boot-shell path:nth-child(3) { stroke: var(--boot-thread); stroke-width: calc(var(--t) * 0.7); stroke-linecap: butt;
        stroke-dasharray: calc(var(--t) * 0.3) calc(var(--t) * 0.2) }
      #boot-shell path:nth-child(4) { stroke-width: calc(var(--t) * 0.56) }
      #boot-shell path:nth-child(n+3) { display: var(--boot-stitch, inline) }
      #boot-input { position: absolute; top: 50%; left: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; resize: none }
    </style>

    <!-- Paint the saved theme's background and chevron before the bundle loads, so a dark theme never flashes white. Any problem
         with the stored settings just skips this; the app applies the theme itself a moment later. -->
    <script>
      try {
        const settings = JSON.parse(localStorage.getItem('settings'))
        const appearance = settings?.appearance
        const scheme = appearance?.colorScheme === 'auto' || !appearance?.colorScheme
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : appearance.colorScheme
        const colors = appearance?.themes?.[appearance.activeTheme]?.[scheme]
        const style = document.documentElement.style
        if (colors?.background) style.backgroundColor = colors.background
        if (colors?.chevron) style.setProperty('--boot-chevron', colors.chevron)
        if (colors?.seam) style.setProperty('--boot-thread', colors.seam)
        if (colors?.accent) style.setProperty('--boot-accent', colors.accent)
        if (settings?.chevron?.size > 0) style.setProperty('--boot-size', settings.chevron.size / 100)
        if (settings?.chevron?.thickness > 0) style.setProperty('--boot-thickness', settings.chevron.thickness + 'px')
        if (settings?.chevron?.thickness < 12) style.setProperty('--boot-stitch', 'none')
      } catch {}
    </script>

  </head>
  <body>
    <div id="root"></div>
    <div id="boot-shell">
      <svg aria-hidden="true" viewBox="-1 -1 2 2"><path d="M1 0L0 1M1 0L0 -1" /><path d="M1 0L0 1M1 0L0 -1" /><path d="M1 0L0 1M1 0L0 -1" /><path d="M1 0L0 1M1 0L0 -1" /></svg>
      <textarea id="boot-input" aria-label="Search" tabindex="-1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    </div>
    <script>
      // Not on touch screens: focusing at load would pop the on-screen keyboard unasked (as in QueryField). Enter has nothing to
      // act on yet, so it must not become a newline in the handed-over text. Escape clears, as it clears a query in the app.
      try {
        const early = document.getElementById('boot-input')
        early.addEventListener('keydown', e => {
          if (e.key === 'Enter') e.preventDefault()
          if (e.key === 'Escape') early.value = ''
        })
        if (!matchMedia('(pointer: coarse)').matches) early.focus({ preventScroll: true })
      } catch {}
    </script>
    <script src="config.js"></script>
    <script src="icons.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
